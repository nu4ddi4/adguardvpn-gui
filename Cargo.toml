[package]
name = "adguard-gui"
version = "0.5.0"
edition = "2021"
rust-version = "1.92"
license = "MIT"
description = "Fedora GNOME용 한국어 AdGuard VPN 앱"
repository = "https://github.com/nu4ddi4/adguardvpn-gui"

[dependencies]
adw = { package = "libadwaita", version = "0.9", features = ["v1_8"] }
gtk = { package = "gtk4", version = "0.11", features = ["v4_20"] }
regex = "1.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

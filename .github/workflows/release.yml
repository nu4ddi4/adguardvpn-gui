# Publication is an explicit maintainer action, after Fedora acceptance testing.
name: Publish Fedora release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example v0.3.0)
        required: true
        type: string
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Install build dependencies
        run: dnf install -y git gcc cargo rust make gtk4-devel libadwaita-devel desktop-file-utils rpm-build
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: Build offline RPM and SRPM
        run: make rpm
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          draft: true
          generate_release_notes: true
          files: |
            build/rpm/RPMS/**/*.rpm
            build/rpm/SRPMS/*.rpm

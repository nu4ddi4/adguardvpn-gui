name: Fedora 릴리스 배포
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  fedora:
    uses: ./.github/workflows/fedora-rpm.yml
  release:
    name: RPM·간편 설치 파일 게시
    needs: fedora
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: fedora-rpm
          path: dist
      - name: 릴리스 안내 확인
        shell: bash
        run: test -f "docs/releases/$GITHUB_REF_NAME.md"
      - uses: softprops/action-gh-release@v2
        with:
          name: 'AdGuard VPN GUI ${{ github.ref_name }} — Fedora 한국어판'
          body_path: docs/releases/${{ github.ref_name }}.md
          prerelease: true
          fail_on_unmatched_files: true
          files: dist/*

name: Fedora build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Install build dependencies
        run: dnf install -y git gcc cargo rust make gtk4-devel libadwaita-devel desktop-file-utils rpm-build
      - uses: actions/checkout@v4
      - name: Compile Rust application
        run: cargo build --release --locked
      - name: Build offline RPM and SRPM
        run: make rpm
      - uses: actions/upload-artifact@v4
        with:
          name: adguard-gui-fedora
          path: |
            build/rpm/RPMS/**/*.rpm
            build/rpm/SRPMS/*.rpm
          if-no-files-found: error

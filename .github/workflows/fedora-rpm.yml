name: Fedora GTK RPM 빌드
on:
  workflow_call:
    inputs:
      source_ref:
        description: 빌드할 릴리스 태그
        required: false
        type: string
        default: ""
permissions:
  contents: read
jobs:
  rpm:
    name: Fedora GTK RPM (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: fedora:43
    steps:
      - name: GTK·Rust 빌드 도구 설치
        run: dnf install -y git python3 make rpm-build cargo rust gcc gtk4-devel libadwaita-devel pkgconf-pkg-config desktop-file-utils tar gzip xorg-x11-server-Xvfb dbus-daemon
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - name: 버전 확인
        shell: bash
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          if [[ -n "$SOURCE_REF" && "${SOURCE_REF#refs/tags/}" != "v$version" ]]; then
            echo '오류: 선택한 태그와 앱 버전이 다릅니다.' >&2
            exit 1
          fi
          bash -n scripts/install-fedora.sh
      - name: GTK 화면·CLI 통합 및 단위 테스트
        if: matrix.arch == 'x86_64'
        env:
          GSK_RENDERER: cairo
          GDK_BACKEND: x11
          GTK_A11Y: none
        run: xvfb-run -a dbus-run-session -- cargo test --locked -- --test-threads=1
      - name: GTK RPM 빌드
        run: make rpm
      - name: 배포 파일 준비
        shell: bash
        env:
          PACKAGE_ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist
          cp build/rpm/RPMS/$PACKAGE_ARCH/adguard-gui-*.$PACKAGE_ARCH.rpm dist/adguard-gui-fedora.$PACKAGE_ARCH.rpm
          if [[ "$PACKAGE_ARCH" == x86_64 ]]; then
            cp scripts/install-fedora.sh packaging/install-fedora.desktop dist/
            cp docs/설치-안내.md dist/install-guide.ko.md
            cp docs/검증-결과.md dist/validation.ko.md
            cp build/rpm/SOURCES/adguard-gui-*.tar.gz dist/
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: fedora-rpm-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
